name: Bug report
description: Report a reproducible TeamCow problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TeamCow. Do not include tokens, provider credentials, private source code, local databases, conversation content, or unredacted local paths. Report vulnerabilities through the process in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: TeamCow version or commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.6
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and CLI version
      description: Leave blank if the problem is unrelated to a provider.
      placeholder: e.g. Codex / output of codex --version
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Attach only logs or screenshots that have been reviewed and redacted.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, user code, conversation content, database data, and identifying local paths.
          required: true
